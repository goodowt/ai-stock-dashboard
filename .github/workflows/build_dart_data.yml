name: Build DART data

on:
  schedule:
    # 하루 두 번, 평일만. 실제 실행은 GitHub Actions 스케줄 지연으로 몇 시간 밀릴 수 있다.
    # 05:10 KST(장 시작 전) = 전날 20:10 UTC(일~목요일)
    - cron: "10 20 * * 0-4"
    # 17:10 KST(장 마감 후 공시 반영) = 08:10 UTC
    - cron: "10 8 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-dart-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 평소에는 몇 분이면 끝나지만, 분기 실적 시즌에는 보고서가 바뀐 종목의 현금흐름을
    # 종목별로 다시 받느라 수십 분 걸릴 수 있다.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Build DART data
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/build_dart_data.py

      - name: Commit dart_data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/dart_data.json
          git diff --staged --quiet || git commit -m "Update DART data"
          git pull --rebase --autostash
          git push
