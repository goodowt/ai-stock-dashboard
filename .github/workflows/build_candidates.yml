name: Build large-cap candidates

on:
  schedule:
    # 매일 15:50 KST(장마감 15:30 이후 여유를 둠) = 06:50 UTC, 평일만
    - cron: "50 6 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-candidates
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Build candidates
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python scripts/build_candidates.py

      - name: Commit candidates.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/candidates.json
          git diff --staged --quiet || git commit -m "Update large-cap candidates"
          git pull --rebase --autostash
          git push
